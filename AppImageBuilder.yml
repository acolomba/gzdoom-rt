# AppDir is populated by tools/appimage/build-appimage.sh.
version: 1
AppDir:
  path: ./AppDir
  app_info:
    id: com.gzdoomrt.GZDoomRT
    name: GZDoom RT
    icon: game_icon
    version: latest
    exec: gzdoom
    exec_args: $@
  apt:
    arch: amd64
    sources:
    - sourceline: deb http://archive.ubuntu.com/ubuntu/ noble main universe
      key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
    - sourceline: deb http://archive.ubuntu.com/ubuntu/ noble-updates main universe
      key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
    include:
    - libopenal1
    - libsdl2-2.0-0
    - libsndfile1
    - libvpx9
    - libwebp7
  runtime:
    env:
      GZDOOM_RT_ASSET_DIR: '$APPDIR/rt'
  files:
    include: []
    exclude:
    - usr/share/man
    - usr/share/doc/*/README.*
    - usr/share/doc/*/changelog.*
    - usr/share/doc/*/NEWS.*
    - usr/share/doc/*/TODO.*
  test:
    fedora-30:
      image: appimagecrafters/tests-env:fedora-30
      command: ./AppRun
    debian-stable:
      image: appimagecrafters/tests-env:debian-stable
      command: ./AppRun
    archlinux-latest:
      image: appimagecrafters/tests-env:archlinux-latest
      command: ./AppRun
    centos-7:
      image: appimagecrafters/tests-env:centos-7
      command: ./AppRun
    ubuntu-xenial:
      image: appimagecrafters/tests-env:ubuntu-xenial
      command: ./AppRun
AppImage:
  arch: x86_64
  update-information: guess
